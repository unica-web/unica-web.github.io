# Site settings
course_name: Programmazione Web
course_description: "Corso di Programmazione Web."
course_semester: "2025-2026"

baseurl: "" # the subpath of your site, e.g. /blog/
url: "http://unica-web.github.io/" # the base hostname & protocol for your site

schoolname: "Università degli Studi di Cagliari"
schoolurl: "https://unica.it"
twitter_username:  

address: |
    Università degli Studi di Cagliari

# Set your Google Analytics tracking ID (set up yours at http://www.google.com/analytics/)
# google_analytics: UA-XXXXXXXX-X

### Do not change the followings unless you know what you are doing ###

# Build settings
markdown: kramdown

# Other options
permalink: blog/:year/:month/:title
excerpt_separator: "<!--more-->"

include: ['_images', '_css']
exclude: ['develop']

dateformat: "%d/%m/%Y"

future: true
collections:
    events:
        output: true
    lectures:
        output: true
    assignments:
        output: false
    announcements:
        output: false
    laboratories:
        output: true
    exam_simulations:
        output: true


defaults:
  - scope:
      path: ""
      type: "assignments"
    values:
      layout: "assignment"
